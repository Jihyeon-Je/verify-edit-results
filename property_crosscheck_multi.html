<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Crosscheck</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5b616e;
    --line: #e3e5ea;
    --tile: #f6f7f9;
    --sel: #eef2ff;
    --accent: #3451d1;
    --good: #1a7f37;
    --good-soft: #e3f4e8;
    --bad: #cf222e;
    --hot: #fff4d6;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  [hidden] { display: none !important; }
  button { font: inherit; font-size: 11.5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  /* With the summary on top, the page scrolls; the detailed columns below keep their own scrolling. */
  body.with-summary .app { height: auto; }
  body.with-summary .cols { height: 100vh; }
  .summary { margin: 10px 0 4px; }
  .sgrid { display: grid; gap: 14px; }
  .scol { min-width: 0; }
  .shead { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .shead span { color: var(--muted); font-weight: 400; }
  .sgroup { border-left: 4px solid var(--line); padding: 4px 0 6px 10px; margin-bottom: 8px; border-radius: 2px; }
  .sgroup .stitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .sgroup ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.4; }
  .sgroup li { cursor: pointer; }
  .sgroup li:hover { text-decoration: underline; }
  .s-both { border-left-color: #6d3fd6; background: #f4f0fd; } .s-both .stitle { color: #5a2fc0; }
  .s-necessary { border-left-color: var(--accent); background: #eef2fc; } .s-necessary .stitle { color: var(--accent); }
  .s-sufficient { border-left-color: var(--good); background: var(--good-soft); } .s-sufficient .stitle { color: var(--good); }
  .s-neither { border-left-color: var(--bad); background: #fdf0f1; } .s-neither .stitle { color: var(--bad); }

  header { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); align-items: start; }
  .imgcap { font-size: 12px; color: var(--muted); margin-top: 4px; text-align: center; }
  header.stacked { grid-template-columns: minmax(0, 1fr); }
  header.stacked .titlerow { flex-direction: column; align-items: flex-start; gap: 10px; }
  header.stacked h1 { font-size: 18px; }
  header.stacked .figure { display: flex; align-items: center; gap: 12px; margin: 8px 0 6px; }
  header.stacked .imgcap { order: -1; margin: 0; font-size: 18px; font-weight: 700; color: var(--fg); }
  header img { height: 130px; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
  .titlerow { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  .counts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: grid; gap: 2px; margin-top: 4px; }
  .counts b { color: var(--good); }
  .help { font-size: 12px; color: var(--muted); margin-top: 6px; max-width: 120ch; }
  .help kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .saved { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .saved.err { color: var(--bad); }

  .cols { display: grid; min-height: 0; }
  .col { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); }
  .ghead { grid-row: 1; padding: 8px 12px; font-size: 14px; font-weight: 600; background: var(--tile); border-bottom: 1px solid var(--line); }
  .ghead + .ghead { border-left: 1px solid var(--line); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .tools h2 { margin: 0 6px 0 0; font-size: 14px; color: var(--fg); }
  .list { overflow-y: auto; min-height: 0; padding-bottom: 60px; }
  .cat { position: sticky; top: 0; z-index: 1; background: var(--bg); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 12px 4px; border-bottom: 1px solid var(--line); }
  .p { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .p:hover { background: var(--tile); }
  .p .id { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
  .p .meta { font-size: 11px; color: var(--muted); }
  .p .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .p .links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .chip { font-family: var(--mono); font-size: 10.5px; border-radius: 4px; padding: 0 5px; background: var(--good-soft); color: var(--good); }
  .p.some { box-shadow: inset 3px 0 0 var(--good); }
  .p.linked { background: var(--good-soft); }
  .p.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .p.hot { background: var(--hot) !important; }
  .inbtn[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .none { padding: 20px 12px; color: var(--muted); }
  .newtag { color: var(--accent); font-weight: 600; }
  .judge { display: grid; gap: 3px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .jrow { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 12px; }
  .jbtn { width: 86px; }
  .jbtn.j-necessary[aria-pressed="true"] { background: #e8eefc; border-color: var(--accent); color: var(--accent); }
  .jbtn.j-sufficient[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .jreason { color: var(--muted); }
  .jedit { font-size: 11px; padding: 0 6px; margin-left: 4px; color: var(--accent); border-color: transparent; background: none; }
  .jedit:hover { border-color: var(--accent); }
  .jedit-box { display: grid; gap: 4px; }
  .jtext { font: inherit; font-size: 12px; width: 100%; padding: 4px 6px; border: 1px solid var(--accent); border-radius: 4px; resize: vertical; }
  .jedit-acts { display: flex; gap: 6px; align-items: center; }
  .jedit-acts .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .jhint { font-size: 11px; color: var(--muted); }
  .cat.sec { font-size: 12px; font-weight: 700; color: var(--fg); letter-spacing: .04em; background: var(--tile); }
  .cat.sec-both { box-shadow: inset 3px 0 0 var(--accent); }
  .cat.sec-necessary { box-shadow: inset 3px 0 0 var(--accent); }
  .cat.sec-sufficient { box-shadow: inset 3px 0 0 var(--good); }
  .cat.sec-neither { margin-top: 18px; border-top: 2px solid var(--line); box-shadow: inset 3px 0 0 var(--bad); }
  .kind { font-weight: 600; }
  .kind.k-shared { color: var(--good); }
  .kind.k-confirmed { color: var(--accent); }
  .kind.k-instance { color: #9a5b00; }
  .kind.k-dropped { color: var(--bad); }

  .lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .7); display: grid; place-items: center; cursor: zoom-out; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
</style>
</head>

  menu.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join("");
  const wanted = decodeURIComponent(location.hash.slice(1));

  const cls = ["p", ins.length ? "some" : "", toSel ? "linked" : "", isSel ? "sel" : ""].join(" ");
  const chips = others(col).flatMap(o => linked(col, p.id, o).map(id => `<span class="chip">${esc(NAME[o])} ${esc(id)}</span>`)).join("");
  const buttons = (OPTIONS.no_buttons || []).includes(col) ? "" : targets(col).map(o => `<button class="inbtn" data-col="${col}" data-id="${esc(p.id)}" data-other="${o}" aria-pressed="${isIn(col, p.id, o)}">In ${esc(NAME[o])}</button>`).join("");
  return `<div class="${cls}" data-col="${col}" data-id="${esc(p.id)}" title="${esc(p.from_statement)}">
    <span class="id">${esc(p.id)}</span>
    <div><div>${esc(p.description)}</div><div class="meta">${esc(p.category)}${carried(p)}${p.tag ? ` · <span class="kind ${kindClass(p.tag)}">${esc(p.tag)}</span>` : ""}</div>${chips ? `<div class="links">${chips}</div>` : ""}<div class="acts">${buttons}</div>${judgment(col, p.id)}</div>
  </div>`;
}

// A property re-extracted with a new prompt carries the ids of the earlier list's properties that state the same thing.
function carried(p) {
  if (STATIC || !Array.isArray(p.carried_from)) return "";  // the shared copy does not show the earlier list
  return p.carried_from.length ? ` · same as earlier ${esc(p.carried_from.join(", "))}` : ` · <span class="newtag">new</span>`;
}

// An optional tag on a property, such as how a combined list decided on it.
function kindClass(tag) {
  return { "shared by all": "k-shared", "missing in some but correct": "k-confirmed", "dropped (instance-specific)": "k-dropped",
    "shared": "k-shared", "not stated, but correct": "k-confirmed", "instance-specific": "k-instance", "dropped": "k-dropped" }[tag] || "";
}

// The necessary / sufficient buttons and reasons under a property. Clicking a button flips it; Edit opens a reason in a
// text box. Either change marks the judgment as yours.
function judgment(col, id) {
  const l = (labels[col] || {})[id];
  if (!l) return "";
  const row = (kind, title) => `<div class="jrow">
      <button class="jbtn j-${kind}" data-col="${col}" data-id="${esc(id)}" data-kind="${kind}" aria-pressed="${!!l[kind]}">${title}</button>
      ${editing && editing.col === col && editing.id === id && editing.kind === kind
        ? `<div class="jedit-box"><textarea class="jtext" rows="3" data-col="${col}" data-id="${esc(id)}" data-kind="${kind}">${esc(l[kind + "_reason"] || "")}</textarea>
            <div class="jedit-acts"><button class="jsave primary">Save</button><button class="jcancel">Cancel</button><span class="jhint">⌘/Ctrl+Enter saves, Esc cancels</span></div></div>`
        : `<span class="jreason">${esc(l[kind + "_reason"] || "")}${STATIC ? "" : ` <button class="jedit" data-col="${col}" data-id="${esc(id)}" data-kind="${kind}" title="Edit this reason">Edit</button>`}</span>`}
    </div>`;
  return `<div class="judge">${row("necessary", "Necessary")}${row("sufficient", "Sufficient")}</div>`;
}

function judged(col, id, which) {
  const l = (labels[col] || {})[id];
  if (!l) return false;
  if (which === "both") return l.necessary && l.sufficient;
  if (which === "neither") return !l.necessary && !l.sufficient;
  return !!l[which];
}

function toggleJudge(col, id, kind) {
  if (STATIC || !(labels[col] || {})[id]) return;
  labels[col][id][kind] = !labels[col][id][kind];
  labels[col][id].by = "you";
  save();
  render();
}

function startEdit(col, id, kind) {
  editing = { col, id, kind };
  render();
  const box = document.querySelector(`.jtext[data-col="${col}"][data-id="${CSS.escape(id)}"][data-kind="${kind}"]`);
  if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}

function finishEdit(keep) {
  if (!editing) return;
  const box = document.querySelector(".jtext");
  const l = (labels[editing.col] || {})[editing.id];
  if (keep && box && l) {
    const text = box.value.trim();
    if (l[editing.kind + "_reason"] !== text) {
      l[editing.kind + "_reason"] = text;
      l.by = "you";
      save();
    }
  }
  editing = null;
  render();
}

document.addEventListener("keydown", e => {
  if (!e.target.classList || !e.target.classList.contains("jtext")) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finishEdit(false); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); finishEdit(true); }
}, true);

const sharedCount = (col, p) => others(col).filter(o => isIn(col, p.id, o)).length;
const SECTIONS = [["both", "Necessary and sufficient"], ["necessary", "Necessary only"], ["sufficient", "Sufficient only"], ["neither", "Neither necessary nor sufficient"]];
const sectionOf = (col, id) => judged(col, id, "both") ? "both" : judged(col, id, "neither") ? "neither" : judged(col, id, "necessary") ? "necessary" : "sufficient";

// The summary: every judged column's properties as plain text, grouped by judgment, most shared first. Clicking a line
// selects that property in its column below.
function renderSummary() {
  const box = $("#summary");
  const cols = COLS.filter(c => labels[c]);
  box.hidden = !OPTIONS.summary || !cols.length;
  if (box.hidden) return;
  box.innerHTML = `<div class="sgrid" style="grid-template-columns: repeat(${cols.length}, minmax(0, 1fr))">` + cols.map(c => {
    const props = [...DATA.columns.find(x => x.key === c).properties].sort((a, b) => sharedCount(c, b) - sharedCount(c, a));
    const groups = SECTIONS.map(([key, title]) => {
      const part = props.filter(p => sectionOf(c, p.id) === key);
      return part.length ? `<div class="sgroup s-${key}"><div class="stitle">${esc(title)} (${part.length})</div>
        <ul>${part.map(p => `<li data-col="${c}" data-id="${esc(p.id)}">${esc(p.description)}</li>`).join("")}</ul></div>` : "";
    }).join("");
    return `<div class="scol"><div class="shead">${esc(NAME[c])} <span>(${props.length})</span></div>${groups}</div>`;
  }).join("") + `</div>`;
}

$("#summary").addEventListener("click", e => {
  const li = e.target.closest("li[data-id]");
  if (!li) return;
  selected = null;
  select(li.dataset.col, li.dataset.id);
  const row = document.querySelector(`#list-${li.dataset.col} .p[data-id="${CSS.escape(li.dataset.id)}"]`);
  if (row) row.scrollIntoView({ block: "center" });
  document.querySelector(".cols").scrollIntoView({ block: "start" });
});

function render() {
  renderSummary();
  for (const c of DATA.columns) {
    const filter = $(`.filter[data-col="${c.key}"]`).value;
    let props = c.properties.filter(p => filter === "all" ? true
      : filter === "new" ? Array.isArray(p.carried_from) && !p.carried_from.length
      : filter.startsWith("judge:") ? judged(c.key, p.id, filter.slice(6))
      : filter.startsWith("tag:") ? p.tag === filter.slice(4)
      : filter === "neither" ? others(c.key).every(o => !isIn(c.key, p.id, o))
      : !isIn(c.key, p.id, filter.slice(4)));
    if (order === "category") props = [...props].sort((a, b) => CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category));
    if (order === "shared") props = [...props].sort((a, b) => sharedCount(c.key, b) - sharedCount(c.key, a));
    let html = "", last = null;
    if (OPTIONS.group_by_judgment && labels[c.key]) {
      // Sections by judgment, in this order; the sort inside each section is kept.
      for (const [key, title] of SECTIONS) {
        const part = props.filter(p => sectionOf(c.key, p.id) === key);
        if (!part.length) continue;
        html += `<div class="cat sec sec-${key}">${esc(title)} (${part.length})</div>` + part.map(p => row(c.key, p)).join("");
      }
    } else {
      for (const p of props) {
        if (order === "category" && p.category !== last) { html += `<div class="cat">${esc(p.category)}</div>`; last = p.category; }
        html += row(c.key, p);
      }
    }
    $(`#list-${c.key}`).innerHTML = html || `<div class="none">Nothing to show.</div>`;
  }
  counts();
}

function counts() {
  $("#counts").innerHTML = DATA.columns.filter(c => !(OPTIONS.no_buttons || []).includes(c.key)).map(c => {
    const n = c.properties.length;
    const judge = labels[c.key] ? ` · <b>${c.properties.filter(p => judged(c.key, p.id, "necessary")).length}</b> necessary, <b>${c.properties.filter(p => judged(c.key, p.id, "sufficient")).length}</b> sufficient, <b>${c.properties.filter(p => judged(c.key, p.id, "neither")).length}</b> neither` : "";
    return `<div>${esc(NAME[c.key])}: ` + targets(c.key).map(o => `<b>${c.properties.filter(p => isIn(c.key, p.id, o)).length}/${n}</b> in ${esc(NAME[o])}`).join(" · ") + judge + `</div>`;
  }).join("");
}

function save() {
  if (STATIC) return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const body = { class: DATA.class, links, labels,
      present: Object.fromEntries(COLS.map(c => [c, Object.fromEntries(Object.entries(present[c]).map(([id, s]) => [id, [...s]]))])) };
    try {
      const reply = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const out = await reply.json();
      if (!reply.ok) throw new Error(out.error || reply.status);
      setSaved(`Saved ${out.saved.slice(11)}`);
    } catch (err) {
      setSaved(`Not saved: ${err.message}`, true);
    }
  }, 200);
}
function setSaved(text, err = false) { const el = $("#saved"); el.textContent = text; el.classList.toggle("err", err); }

// Unmarking "In X" also drops the property's links to X, since a link counts as present.
// The leftmost column is the reference. A property linked to properties in the other non-reference columns agrees with
// them, so marking or linking it against the reference applies to them too, and so does undoing it.
const agreeing = (col, id) => COLS.filter(c => c !== COLS[0] && c !== col).flatMap(c => linked(col, id, c).map(oid => [c, oid]));

function setIn(col, id, other, on) {
  if (on) (present[col][id] = present[col][id] || new Set()).add(other);
  else {
    if (present[col][id]) present[col][id].delete(other);
    links = links.filter(([a, ai, b, bi]) => !((a === col && ai === id && b === other) || (b === col && bi === id && a === other)));
  }
}

function toggleIn(col, id, other) {
  if (STATIC) return;
  const on = !isIn(col, id, other);
  setIn(col, id, other, on);
  if (other === COLS[0] && col !== COLS[0]) agreeing(col, id).forEach(([c, oid]) => setIn(c, oid, other, on));
  save();
  render();
}

function hasLink(col, id, other, oid) {
  return links.some(([a, ai, b, bi]) => (a === col && ai === id && b === other && bi === oid) || (a === other && ai === oid && b === col && bi === id));
}

function setLink(col, id, other, oid, on) {
  if (on && !hasLink(col, id, other, oid)) links.push([col, id, other, oid]);
  if (!on) links = links.filter(([a, ai, b, bi]) => !((a === col && ai === id && b === other && bi === oid) || (a === other && ai === oid && b === col && bi === id)));
}

function toggleLink(col, id, other, oid) {
  if (STATIC) return;
  const on = !hasLink(col, id, other, oid);
  setLink(col, id, other, oid, on);
  // Linking a reference property to one of an agreeing pair links it to the rest of the pair too.
  const ref = col === COLS[0] ? [col, id] : other === COLS[0] ? [other, oid] : null;
  const target = col === COLS[0] ? [other, oid] : [col, id];
  if (ref && target[0] !== COLS[0]) agreeing(...target).forEach(([c, x]) => setLink(ref[0], ref[1], c, x, on));
  save();
  render();
}

// Selecting a property also scrolls every other column to the first property it is linked to there.
function select(col, id) {
  selected = id ? { col, id } : null;
  render();
  if (!selected) return;
  const el = document.querySelector(`#list-${col} .p[data-id="${CSS.escape(id)}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
  for (const o of others(col)) {
    const ids = new Set(linked(col, id, o));
    const first = [...document.querySelectorAll(`#list-${o} .p`)].find(row => ids.has(row.dataset.id));
    if (first) first.scrollIntoView({ block: "center" });
  }
}

$("#cols").addEventListener("click", e => {
  if (e.target.closest(".jedit")) { const b = e.target.closest(".jedit"); startEdit(b.dataset.col, b.dataset.id, b.dataset.kind); return; }
  if (e.target.closest(".jsave")) { finishEdit(true); return; }
  if (e.target.closest(".jcancel")) { finishEdit(false); return; }
  if (e.target.closest(".jedit-box, .jreason")) return;
  const jbtn = e.target.closest(".jbtn");
  if (jbtn) { toggleJudge(jbtn.dataset.col, jbtn.dataset.id, jbtn.dataset.kind); return; }
  const button = e.target.closest(".inbtn");
  if (button) { toggleIn(button.dataset.col, button.dataset.id, button.dataset.other); return; }
  const el = e.target.closest(".p");
  if (!el) return;
  const col = el.dataset.col, id = el.dataset.id;
  if (selected && selected.col !== col && !STATIC) { toggleLink(selected.col, selected.id, col, id); return; }
  select(col, selected && selected.id === id ? null : id);
});

// Hovering a property lights up what it is linked to in the other columns.
document.addEventListener("mouseover", e => {
  document.querySelectorAll(".p.hot").forEach(el => el.classList.remove("hot"));
  const el = e.target.closest(".p");
  if (!el) return;
  for (const o of others(el.dataset.col)) {
    for (const id of linked(el.dataset.col, el.dataset.id, o)) {
      const other = document.querySelector(`#list-${o} .p[data-id="${CSS.escape(id)}"]`);
      if (other) other.classList.add("hot");
    }
  }
});

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea, [contenteditable]")) return;
  if (e.key === "Escape") { if (!$("#lb").hidden) { $("#lb").hidden = true; return; } select(null, null); return; }
  if (!DATA) return;
  const col = selected ? selected.col : COLS[0];
  const ids = [...document.querySelectorAll(`#list-${col} .p`)].map(el => el.dataset.id);
  if (!ids.length) return;
  const at = selected ? ids.indexOf(selected.id) : -1;
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); select(col, ids[Math.min(ids.length - 1, at + 1)]); }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); select(col, ids[Math.max(0, at < 0 ? 0 : at - 1)]); }
});

$("#img").addEventListener("click", () => { $("#lbimg").src = $("#img").src; $("#lb").hidden = false; });
$("#lb").addEventListener("click", () => { $("#lb").hidden = true; });

start().catch(err => setSaved(`Could not load: ${err.message}`, true));
</script>
</body>
</html>
