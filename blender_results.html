<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blender Repair Results</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #555555;
    --faint: #8f8f8f;
    --line: #e2e2e2;
    --soft: #f5f5f5;
    --code: #fafafa;
    --pass: #1f9d55;
    --fail: #d93b3b;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1680px; margin: 0 auto; padding-inline: 20px; padding-block: 12px 16px; }

  nav.assets { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 10px; border-bottom: 1px solid var(--line); }
  nav.assets button {
    flex: 0 0 auto; display: grid; grid-template-columns: 34px auto; gap: 0 8px; align-items: center; text-align: left;
    font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px 4px 4px; cursor: pointer;
  }
  nav.assets button img { grid-row: span 2; width: 34px; height: 34px; object-fit: contain; border-radius: 4px; background: #fff; }
  nav.assets button .nm { font-weight: 600; white-space: nowrap; }
  nav.assets button .sc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  nav.assets button[aria-current="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  nav.assets button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  main.viewer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 30%); gap: 20px; padding-top: 12px; align-items: start; }
  @media (max-width: 1050px) { main.viewer { grid-template-columns: minmax(0, 1fr); } }

  .asset-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px; }
  h2 { font-size: 18px; margin: 0; text-transform: capitalize; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--fg); }
  .label { font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }

  /* Top: the reference image beside the text. Below: the initial and final rows of four views each. */
  .top-row { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 640px) { .top-row { grid-template-columns: minmax(0, 1fr); } }
  figure.shot { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; cursor: zoom-in; min-width: 0; }
  figure.shot img { display: block; width: 100%; height: 100%; object-fit: contain; }
  figure.ref { aspect-ratio: 1 / 1; margin-top: 4px; }
  .desc { display: grid; gap: 6px; min-width: 0; }
  .desc p { margin: 0; max-width: 130ch; font-size: 13.5px; }
  .desc .small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .board { display: grid; grid-template-columns: 64px repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .board .colhead { grid-row: 1; align-self: end; text-align: center; }
  .board .v1 { grid-column: 2; } .board .v2 { grid-column: 3; } .board .v3 { grid-column: 4; } .board .v4 { grid-column: 5; }
  .board .rowhead { grid-column: 1; display: grid; align-content: center; gap: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .board .rowhead b { color: var(--fg); font-size: 13px; }
  .board .init { grid-row: 2; } .board .fin { grid-row: 3; }
  .board figure.view { aspect-ratio: 4 / 3; }
  @media (max-width: 480px) { .board { grid-template-columns: 46px repeat(4, minmax(0, 1fr)); gap: 4px; } }

  aside.props-panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; border: 1px solid var(--fg); border-radius: 8px; min-width: 0; }
  @media (max-width: 1050px) { aside.props-panel { position: static; max-height: none; } }
  .ph { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .ph h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
  .ph h3 .meta { font-weight: 400; font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button {
    font: inherit; font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .filters button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
  input[type="search"] { font: inherit; font-size: 13px; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--fg); background: var(--bg); }
  input[type="search"]:focus { outline: 2px solid var(--fg); outline-offset: -1px; }
  .hint { margin: 0; font-size: 11.5px; color: var(--faint); }
  ol.props { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
  ol.props li { border-bottom: 1px solid var(--line); }
  ol.props li:last-child { border-bottom: 0; }
  button.prow {
    display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 10px; width: 100%; text-align: left;
    font: inherit; color: var(--fg); background: var(--bg); border: 0; padding: 10px 14px; cursor: pointer;
  }
  button.prow:hover { background: var(--soft); }
  button.prow:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  button.prow[aria-expanded="true"] { background: var(--soft); }
  .badge { align-self: start; justify-self: start; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .badge.fixed { background: var(--fg); color: #fff; }
  .badge.broke { border: 1.5px solid var(--fg); color: var(--fg); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .badge.failing { border: 1px dashed var(--muted); color: var(--muted); }
  .badge.passing { border: 1px solid var(--line); color: var(--faint); }
  .ptext { min-width: 0; display: grid; gap: 4px; }
  .pid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .pid .cat { font-family: var(--sans); margin-left: 6px; color: var(--faint); }
  .pdesc { overflow-wrap: anywhere; }
  .strip { display: flex; gap: 3px; align-items: center; }
  .strip i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; background: var(--fail); }
  .strip i.p { background: var(--pass); }
  .strip i.n { background: transparent; border: 1.5px dashed var(--faint); }

  .pbody { padding: 4px 14px 14px; background: var(--soft); display: grid; gap: 12px; min-width: 0; }
  .measure { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 480px) { .measure { grid-template-columns: minmax(0, 1fr); } }
  .mcol { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
  .mcol .label { margin-bottom: 4px; }
  .mrow { font-size: 12px; display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 4px; padding: 2px 0; }
  .mrow .mk { width: 10px; height: 10px; border-radius: 2px; margin-top: 3px; background: var(--fail); }
  .mrow .mk.p { background: var(--pass); }
  .mrow .mv { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .mrow .mv .num { font-family: var(--mono); font-size: 11.5px; }
  .codebox { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
  .codebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button, .copy {
    font: inherit; font-size: 11.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
  .codenote { font-size: 11.5px; color: var(--muted); padding: 6px 10px 0; }
  pre { margin: 0; padding: 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--code); border-radius: 0 0 6px 6px; tab-size: 4; }
  .empty { padding: 18px 14px; color: var(--muted); }

  .lightbox { position: fixed; inset: 0; background: rgba(255,255,255,0.97); display: grid; place-items: center; z-index: 20; padding: 24px; cursor: zoom-out; }
  .lightbox figure { margin: 0; max-width: min(1200px, 100%); display: grid; gap: 8px; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; border: 1px solid var(--line); }
  .lightbox figcaption { text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="assets" id="assets" aria-label="Assets"></nav>
  <main class="viewer">
    <section id="left" aria-live="polite"></section>
    <aside class="props-panel" aria-label="Properties">
      <div class="ph">
        <h3><span>Properties</span><span class="meta" id="pcount"></span></h3>
        <div class="filters" id="filters" role="group" aria-label="Filter properties"></div>
        <input type="search" id="q" placeholder="Search properties and checker code" aria-label="Search properties">
        <p class="hint">Squares: one per iteration, green where the check passed and red where it failed. Click a property for its measurements and checker code.</p>
      </div>
      <ol class="props" id="props"></ol>
    </aside>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>

.y\n            and s.x >= 0.45 * whole[\"size\"].x\n            and s.y >= 0.30 * whole[\"size\"].y\n            and s.z >= 0.08 * whole[\"size\"].z\n            and abs(b[\"center\"].x - whole[\"center\"].x) <= 0.15 * whole[\"size\"].x\n            and b[\"center\"].z >= whole[\"center\"].z\n        ):\n            candidates.append(piece)\n\n    return expect(\"carapace-like central body part count\", len(candidates), \">=\", 1)", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_e02", "category": "Existence", "source": "explicit", "description": "The carapace is domed.", "status": "passing", "trace": [true, true, true, true], "initial": {"passed": true, "metric": "carapace crown rise across width", "actual": 0.3639786972957806, "op": ">=", "target": 0.08, "conditions": [{"passed": true, "metric": "carapace crown rise across width", "actual": 0.3639786972957806, "op": ">=", "target": 0.08, "unit": ""}, {"passed": true, "metric": "carapace crown rise across length", "actual": 0.37355107664306625, "op": ">=", "target": 0.08, "unit": ""}, {"passed": true, "metric": "carapace dome depth ratio", "actual": 0.2805179014391779, "op": ">=", "target": 0.1, "unit": ""}, {"passed": true, "metric": "carapace dome depth ratio", "actual": 0.2805179014391779, "op": "<=", "target": 0.75, "unit": ""}]}, "final": {"passed": true, "metric": "carapace crown rise across width", "actual": 0.40460945335495674, "op": ">=", "target": 0.08, "conditions": [{"passed": true, "metric": "carapace crown rise across width", "actual": 0.40460945335495674, "op": ">=", "target": 0.08, "unit": ""}, {"passed": true, "metric": "carapace crown rise across length", "actual": 0.4170015552045059, "op": ">=", "target": 0.08, "unit": ""}, {"passed": true, "metric": "carapace dome depth ratio", "actual": 0.42293483977215773, "op": ">=", "target": 0.1, "unit": ""}, {"passed": true, "metric": "carapace dome depth ratio", "actual": 0.42293483977215773, "op": "<=", "target": 0.75, "unit": ""}]}, "code": "def check_prop_e02():\n    crab = parts(\"Crab\")\n    if not crab:\n        return missing(\"carapace\")\n    shell_pieces = pieces(crab)\n    if not shell_pieces:\n        return missing(\"carapace\")\n    \n    carapace = shell_pieces[0]\n    b = box(carapace)\n    if b[\"size\"].x <= 0 or b[\"size\"].y <= 0 or b[\"size\"].z <= 0:\n        return missing(\"carapace\")\n    \n    pts = points(carapace, limit=4000)\n    cx, cy = b[\"center\"].x, b[\"center\"].y\n    hx, hy = b[\"size\"].x * 0.5, b[\"size\"].y * 0.5\n    \n    central = []\n    side_edge = []\n    end_edge = []\n    for p in pts:\n        nx = abs(p.x - cx) / hx\n        ny = abs(p.y - cy) / hy\n        if nx <= 0.25 and ny <= 0.25:\n            central.append(p.z)\n        if nx >= 0.70 and ny <= 0.40:\n            side_edge.append(p.z)\n        if ny >= 0.70 and nx <= 0.40:\n            end_edge.append(p.z)\n    \n    if not central or not side_edge or not end_edge:\n        return missing(\"measurable carapace dome\")\n    \n    def quantile(values, fraction):\n        values = sorted(values)\n        return values[int((len(values) - 1) * fraction)]\n    \n    crown_z = quantile(central, 0.75)\n    side_z = quantile(side_edge, 0.85)\n    end_z = quantile(end_edge, 0.85)\n    h = b[\"size\"].z\n    \n    side_rise = (crown_z - side_z) / h\n    end_rise = (crown_z - end_z) / h\n    depth_ratio = h / ((b[\"size\"].x + b[\"size\"].y) * 0.5)\n    \n    return all_of(\n        expect(\"carapace crown rise across width\", side_rise, \">=\", 0.08),\n        expect(\"carapace crown rise across length\", end_rise, \">=\", 0.08),\n        expect(\"carapace dome depth ratio\", depth_ratio, \">=\", 0.10),\n        expect(\"carapace dome depth ratio\", depth_ratio, \"<=\", 0.75)\n    )", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_e03", "category": "Proportion", "source": "explicit", "description": "The carapace is wider than it is long.", "status": "passing", "trace": [true, true, true, true], "initial": {"passed": true, "metric": "carapace width / length", "actual": 1.5508526105866038, "op": ">", "target": 1.0}, "final": {"passed": true, "metric": "carapace width / length", "actual": 1.7170153423751808, "op": ">", "target": 1.0}, "code": "def check_prop_e03():\n    crab = pieces(parts(\"Crab\"))\n    if not crab:\n        return missing(\"carapace\")\n    carapace = crab[0]\n    length = length_of(carapace)\n    if length <= 0:\n        return missing(\"measurable carapace\")\n    ratio = width_of(carapace) / length\n    return expect(\"carapace width / length\", ratio, \">\", 1.0)", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_e04", "category": "Proportion", "source": "explicit", "description": "The carapace tapers toward the rear.", "status": "passing", "trace": [true, true, true, true], "initial": {"passed": true, "metric": "rear narrower than middle", "actual": 0.8935169242462411, "op": "<=", "target": 0.95, "conditions": [{"passed": true, "metric": "rear narrower than middle", "actual": 0.8935169242462411, "op": "<=", "target": 0.95, "unit": ""}, {"passed": true, "metric": "rear taper is gentle", "actual": 0.8935169242462411, "op": ">=", "target": 0.6, "unit": ""}]}, "final": {"passed": true, "metric": "rear narrower than middle", "actual": 0.8964064478840374, "op": "<=", "target": 0.95, "conditions": [{"passed": true, "metric": "rear narrower than middle", "actual": 0.8964064478840374, "op": "<=", "target": 0.95, "unit": ""}, {"passed": true, "metric": "rear taper is gentle", "actual": 0.8964064478840374, "op": ">=", "target": 0.6, "unit": ""}]}, "code": "def check_prop_e04():\n    crab = parts(\"Crab\")\n    if not crab:\n        return missing(\"carapace\")\n    shell_pieces = pieces(crab)\n    if not shell_pieces:\n        return missing(\"carapace\")\n    carapa   if not hand:\n            return missing(side_name + \" claw pincer hand\")\n\n        dims = sorted((width_of(hand), length_of(hand), height_of(hand)))\n        if dims[2] <= 0:\n            return missing(side_name + \" claw pincer hand\")\n\n        breadth_ratio = dims[1] / dims[2]\n        results.append(expect(\n            side_name + \" pincer hand breadth relative to its longest dimension\",\n            breadth_ratio,\n            \">=\",\n            0.25\n        ))\n        results.append(expect(\n            side_name + \" pincer hand breadth ratio upper bound\",\n            breadth_ratio,\n            \"<=\",\n            1.0\n        ))\n\n    return all_of(*results)", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_v02", "category": "Proportion", "source": "visual", "description": "The walking-leg segments should have substantial, smoothly tapered widths rather than appearing as extremely thin spikes.", "status": "fixed", "trace": [false, true, true, true], "initial": {"passed": false, "metric": "minimum walking-leg width-to-length ratio", "actual": 0.06891714003832435, "op": ">=", "target": 0.09, "conditions": [{"passed": false, "metric": "minimum walking-leg width-to-length ratio", "actual": 0.06891714003832435, "op": ">=", "target": 0.09, "unit": ""}, {"passed": true, "metric": "maximum walking-leg width-to-length ratio", "actual": 0.2133278416681072, "op": "<=", "target": 0.35, "unit": ""}]}, "final": {"passed": true, "metric": "minimum walking-leg width-to-length ratio", "actual": 0.1759786294824678, "op": ">=", "target": 0.09, "conditions": [{"passed": true, "metric": "minimum walking-leg width-to-length ratio", "actual": 0.1759786294824678, "op": ">=", "target": 0.09, "unit": ""}, {"passed": true, "metric": "maximum walking-leg width-to-length ratio", "actual": 0.18983471076009512, "op": "<=", "target": 0.35, "unit": ""}]}, "code": "def check_prop_v02():\n    crab = parts( rd its back end\", rise_back, \">=\", 0.06)\n    )", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_e04", "category": "Proportion", "source": "explicit", "description": "The casque crest is high.", "status": "passing", "trace": [true, true, false, true, true], "initial": {"passed": true, "metric": "casque height relative to head height", "actual": 1.2438928992620215, "op": ">=", "target": 1.2, "conditions": [{"passed": true, "metric": "casque height relative to head height", "actual": 1.2438928992620215, "op": ">=", "target": 1.2, "unit": ""}, {"passed": true, "metric": "casque height relative to head height", "actual": 1.2438928992620215, "op": "<=", "target": 3.0, "unit": ""}]}, "final": {"passed": true, "metric": "casque height relative to head height", "actual": 1.5146767855712522, "op": ">=", "target": 1.2, "conditions": [{"passed": true, "metric": "casque height relative to head height", "actual": 1.5146767855712522, "op": ">=", "target": 1.2, "unit": ""}, {"passed": true, "metric": "casque height relative to head height", "actual": 1.5146767855712522, "op": "<=", "target": 3.0, "unit": ""}]}, "code": "def check_prop_e04():\n    body = parts(\"Body\")\n    eyes = parts(\"Eye_*\")\n    if not body:\n        return missing(\"body containing the head and casque crest\")\n    if not eyes:\n        return missing(\"eyes locating the head\")\n\n    eye_box = box(eyes)\n    eye_center = eye_box[\"center\"]\n    head_scale = max(width_of(eyes), height_of(eyes) * 2.0)\n    if head_scale <= 0:\n        return missing(\"measurable head\")\n\n    body_pts = points(body, limit=4000)\n    base_pts = [\n        p for p in body_pts\n        if eye_center.y - head_scale <= p.y <= eye_center.y + 0.7 * head_scale\n    ]\n    crest_zone = [\n        p for p in body_pts\n        if eye_center.y - head_scale <= p.y <= eye_center.y + 1.7 * head_scale\n    ]\n    if len(base_pts) < 20 or len(crest_zone) < 20:\n rue, true, false, true], "initial": {"passed": false, "metric": "minimum limb centerline bend", "actual": 0.005470907819398453, "op": ">=", "target": 0.1, "unit": "relative curvature"}, "final": {"passed": true, "metric": "minimum limb centerline bend", "actual": 0.2694530980286599, "op": ">=", "target": 0.1, "unit": "relative curvature"}, "code": "def check_prop_e11():\n    legs = parts(\"Leg*\")\n    if len(legs) < 2:\n        return missing(\"limbs\")\n\n    bend_scores = []\n    for leg in legs:\n        leg_pieces = pieces(leg)\n        if not leg_pieces:\n            return missing(\"limb geometry\")\n\n        main = leg_pieces[0]\n        pa = principal_axes(main)\n        axis = pa[\"axis\"]\n        pts = points(main, limit=1200)\n        if len(pts) < 20 or pa[\"length\"] <= 0:\n            return missing(\"measurable limb geometry\")\n\n        projections = [(p - pa[\"center\"]).dot(axis) for p in pts]\n        lo = min(projections)\n        hi = max(projections)\n        span = hi - lo\n        if span <= 0:\n            bend_scores.append(0.0)\n            continue\n\n        end_a = [p for p, t in zip(pts, projections) if t <= lo + 0.22 * span]\n        middle = [p for p, t in zip(pts, projections) if lo + 0.40 * span <= t <= lo + 0.60 * span]\n        end_b = [p for p, t in zip(pts, projections) if t >= lo + 0.78 * span]\n\n        if not end_a or not middle or not end_b:\n            bend_scores.append(0.0)\n            continue\n\n        ca = sum(end_a, Vector((0.0, 0.0, 0.0))) / len(end_a)\n        cm = sum(middle, Vector((0.0, 0.0, 0.0))) / len(middle)\n        cb = sum(end_b, Vector((0.0, 0.0, 0.0))) / len(end_b)\n\n        chord = cb - ca\n        if chord.length <= 0:\n            bend_scores.append(0.0)\n            continue\n\n        deviation = (cm - ca).cross(chord).length / chord.length\n        bend_scores.append(deviation / pa[\"length\"])\n\n    return expect(\"minimum limb centerline bend\", min(bend_scores), \">=\", 0.10, \"relati o, \"<=\", 0.45),\n    )", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_e17", "category": "Layout", "source": "explicit", "description": "The claws are pointed.", "status": "fixed", "trace": [false, true, true, true, true], "initial": {"passed": false, "metric": "fraction of claws with an elongated tapered point", "actual": 0.0, "op": ">=", "target": 0.7}, "final": {"passed": true, "metric": "fraction of claws with an elongated tapered point", "actual": 0.75, "op": ">=", "target": 0.7}, "code": "def check_prop_e17():\n    limbs = parts(\"Leg*\")\n    if not limbs:\n        return missing(\"claws\")\n\n    claws = []\n    for limb in limbs:\n        limb_pieces = pieces(limb)\n        if not limb_pieces:\n            continue\n        main_span = max(box(limb_pieces[0])[\"size\"])\n        for piece in limb_pieces[1:]:\n            if max(box(piece)[\"size\"]) <= 0.32 * main_span:\n                claws.append(piece)\n\n    if not claws:\n        return missing(\"claws\")\n\n    pointed = 0\n    for claw in claws:\n        pa = principal_axes(claw)\n        mean_thickness = 0.5 * (pa[\"width\"] + pa[\"thickness\"])\n        aspect = pa[\"length\"] / max(mean_thickness, 1e-9)\n\n        sample = points(claw, limit=350)\n        if len(sample) < 8:\n            continue\n\n        axis = pa[\"axis\"]\n        center = pa[\"center\"]\n        projections = [(p - center).dot(axis) for p in sample]\n        lo = min(projections)\n        hi = max(projections)\n        span = hi - lo\n        if span <= 1e-9:\n            continue\n\n        low_radii = []\n        high_radii = []\n        for p, projection in zip(sample, projections):\n            offset = p - center\n            radial = (offset - axis * offset.dot(axis)).length\n            fraction = (projection - lo) / span\n            if fraction <= 0.25:\n                low_radii.append(radial)\n            elif fraction >= 0.75:\n                high_radii.append(radial)\n\n        if not low_radii or not high_radii:\n            continue\n\n        low_radius = sum(low_radii) / len(low_radii)\n        high_radius = sum(high_radii) / len(high_radii)\n        taper_ratio = min(low_radius, high_radius) / max(low_radius, high_radius, 1e-9)\n\n        if aspect >= 1.25 and taper_ratio <= 0.60:\n            pointed += 1\n\n    pointed_fraction = pointed / len(claws)\n    return expect(\"fraction of claws with an elongated tapered point\", pointed_fraction, \">=\", 0.7)", "code_initial": "", "suite_final": "verification_tests.py", "suite_initial": "verification_tests.py"}, {"id": "prop_e18", "category": "Proportion", "source": "explicit", "description": "The tail is long.", "status": "passing", "trace": [true, false, true, false, true], "initial": {"passed": true, "metric": "tail length-to-width ratio", "actual": 3.59848231387155, "op": ">=", "target": 2.5, "conditions": [{"passed": true, "metric": "tail length-to-width ratio", "actual": 3.59848231387155, "op": ">=", "target": 2.5, "unit": ""}, {"passed": true, "metric": "tail length-to-width ratio", "actual": 3.59848231387155, "op": "<=", "target": 7.5, "unit": ""}]}, "final": {"passed": true, "metric": "tail length-to-width ratio", "actual": 5.653258861378171, "op": ">=", "target": 2.5, "conditions": [{"passed": true, "metric": "tail length-to-width ratio", "actual": 5.653258861378171, "op": ">=", "target": 2.5, "unit": ""}, {"passed": true, "metric": "tail length-to-width ratio", "actual": 5.653258861378171, "op": "<=", "target": 7.5, "unit": ""}]}, "code": "def check_prop_e18():\n    body = parts(\"Body\")\n    hind_legs = parts([\"LegBL\", \"LegBR\"])\n    if not body:\n        return missing(\"body containing the tail\")\n    if not hind_legs:\n        return missing(\"hind limbs marking the tail base\")\n\n    tail_base_y = max(box(hind_legs)[\"center\"].y, box(hind_legs)[\"max\"].y)\n    body_points = points(body, limit=4000)\n    tail_points = [p for const VIEW_NAMES = { front: "Front", back: "Back", iso_a: "Iso A", iso_b: "Iso B" };
const STATUS = {
  fixed: "Fixed", broke: "Broke", failing: "Still failing", passing: "Passing"
};
const ORDER = { fixed: 0, broke: 1, failing: 2, passing: 3 };
let current = 0, filter = "all", open = new Set();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fmt(v) {
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : (Math.abs(v) >= 100 ? v.toFixed(1) : v.toPrecision(3));
  if (typeof v === "boolean") return v ? "true" : "false";
  if (v && typeof v === "object") return JSON.stringify(v);
  return v == null ? "" : String(v);
}

function navs() {
  const nav = $("assets"); nav.innerHTML = "";
  DATA.runs.forEach((run, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-current", String(i === current));
    const last = run.passed.length - 1;
    b.innerHTML = `<img alt="" src="${run.final.front}"><span class="nm">${esc(run.name)}</span><span class="sc">${run.passed[0]} → ${run.passed[last]} / ${run.total}</span>`;
    b.onclick = () => select(i);
    nav.appendChild(b);
  });
}

function left() {
  const run = DATA.runs[current];
  const last = run.passed.length - 1;
  const trace = run.passed.map((n, i) => `${i + run.initial_iteration}: ${n}`).join(" · ");
  const views = ["front", "back", "iso_a", "iso_b"];
  const row = (which, cls, label, iteration, passed) =>
    `<div class="rowhead ${cls}"><b>${label}</b><span>iter ${iteration}</span><span>${passed} / ${run.total}</span></div>` +
    views.map((v, i) => `<figure class="shot view ${cls} v${i + 1}" data-cap="${esc(run.name)} · ${label} (iteration ${iteration}) · ${VIEW_NAMES[v]}"><img alt="${label} ${VIEW_NAMES[v]} view" src="${run[which][v]}"></figure>`).join("");
  $("left").innerHTML = `
    <div class="asset-head">
      <h2>${esc(run.name)}</h2>
      <span class="meta">${run.generator ? `generator <b>${esc(run.generator)}</b> · ` : ""}checks passed <b>${run.passed[0]} → ${run.passed[last]}</b> of ${run.total} · ${run.passed.length} iteration${run.passed.length > 1 ? "s" : ""}</span>
    </div>
    <div class="top-row">
      <div>
        <p class="label">Reference</p>
        ${run.reference ? `<figure class="shot ref" data-cap="${esc(run.name)} · reference"><img alt="Reference image for ${esc(run.name)}" src="${run.reference}"></figure>` : `<p class="meta">No reference image</p>`}
      </div>
      <div class="desc">
        <p class="label">Text description</p>
        <p>${esc(run.description)}</p>
        <p class="small">Checks passed by iteration — ${esc(trace)} (of ${run.total})</p>
        ${run.notes.map((n) => `<p class="small">${esc(n)}</p>`).join("")}
      </div>
    </div>
    <div class="board">
      ${views.map((v, i) => `<p class="label colhead v${i + 1}">${VIEW_NAMES[v]}</p>`).join("")}
      ${row("initial", "init", "Initial", run.initial_iteration, run.passed[0])}
      ${row("final", "fin", "Final", run.final_iteration, run.passed[last])}
    </div>`;
  $("left").querySelectorAll("figure.shot").forEach((el) => {
    el.addEventListener("click", () => {
      const img = el.tagName === "IMG" ? el : el.querySelector("img");
      $("lbimg").src = img.src; $("lbimg").alt = img.alt;
      $("lbcap").textContent = el.dataset.cap || img.alt;
      $("lightbox").hidden = false;
    });
  });
}

function filters() {
  const run = DATA.runs[current];
  const counts = { all: run.properties.length, fixed: 0, broke: 0, failing: 0, passing: 0 };
  run.properties.forEach((p) => counts[p.status]++);
  $("filters").innerHTML = "";
  [["all", "All"], ["fixed", "Fixed"], ["broke", "Broke"], ["failing", "Still failing"], ["passing", "Passing"]].forEach(([key, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter === key));
    b.textContent = `${label} ${counts[key]}`;
    b.onclick = () => { filter = key; filters(); props(); };
    $("filters").appendChild(b);
  });
  const last = run.passed.length - 1;
  $("pcount").textContent = `${run.passed[last]} of ${run.total} passing at the end`;
}

function measure(m, label, iteration) {
  if (!m) return `<div class="mcol"><p class="label">${label} · iteration ${iteration}</p><div class="mrow"><span></span><span class="mv">not measured</span></div></div>`;
  const rows = (m.conditions && m.conditions.length ? m.conditions : [m]).map((c) =>
    `<div class="mrow"><span class="mk${c.passed ? " p" : ""}" title="${c.passed ? "pass" : "fail"}"></span><span class="mv">${esc(c.metric || "")} <span class="num">${esc(fmt(c.actual))} ${esc(c.op || "")} ${esc(fmt(c.target))}</span>${c.unit ? " " + esc(c.unit) : ""}</span></div>`).join("");
  const err = m.error ? `<div class="mrow"><span></span><span class="mv">${esc(m.error)}</span></div>` : "";
  return `<div class="mcol"><p class="label">${label} · iteration ${iteration} · ${m.passed ? "pass" : "fail"}</p>${rows}${err}</div>`;
}

function body(p, run) {
  const tabs = p.code_initial
    ? `<div class="tabs" role="group" aria-label="Checker version"><button type="button" data-v="final" aria-pressed="true">Final checker</button><button type="button" data-v="initial" aria-pressed="false">Initial checker</button></div>`
    : `<span class="pid">${esc(p.suite_final)}</span>`;
  const note = p.code_initial ? `<p class="codenote">This checker's bounds were recalibrated during the run: the initial version is from ${esc(p.suite_initial)}, the final from ${esc(p.suite_final)}.</p>` : "";
  return `<div class="pbody">
      <div class="measure">${measure(p.initial, "Initial", run.initial_iteration)}${measure(p.final, "Final", run.final_iteration)}</div>
      <div class="codebox">
        <div class="codebar">${tabs}<button type="button" class="copy">Copy code</button></div>${note}
        <pre><code>${esc(p.code || "(no checker code found)")}</code></pre>
      </div>
    </div>`;
}

function props() {
  const run = DATA.runs[current];
  const q = $("q").value.trim().toLowerCase();
  const list = run.properties
    .filter((p) => filter === "all" || p.status === filter)
    .filter((p) => !q || (p.id + " " + p.description + " " + p.category + " " + p.code).toLowerCase().includes(q))
    .sort((a, b) => ORDER[a.status] - ORDER[b.status] || a.id.localeCompare(b.id));
  const ol = $("props"); ol.innerHTML = "";
  if (!list.length) { ol.innerHTML = `<li class="empty">No properties match.</li>`; return; }
  for (const p of list) {
    const li = document.createElement("li");
    const strip = p.trace.map((t) => `<i class="${t === true ? "p" : t === null ? "n" : ""}" title="iteration ${""}"></i>`).join("");
    const expanded = open.has(p.id);
    li.innerHTML = `<button type="button" class="prow" aria-expanded="${expanded}">
        <span class="badge ${p.status}">${STATUS[p.status]}</span>
        <span class="ptext">
          <span class="pid">${esc(p.id)}<span class="cat">${esc(p.category)}${p.source ? " · " + esc(p.source) : ""}</span></span>
          <span class="pdesc">${esc(p.description)}</span>
          <span class="strip" aria-label="pass or fail at each iteration">${strip}</span>
        </span>
      </button>`;
    li.querySelectorAll(".strip i").forEach((el, i) => { el.title = `iteration ${i + run.initial_iteration}: ${p.trace[i] === null ? "not measured" : p.trace[i] ? "pass" : "fail"}`; });
    const row = li.querySelector("button.prow");
    row.onclick = () => {
      if (open.has(p.id)) open.delete(p.id); else open.add(p.id);
      props();
    };
    if (expanded) {
      li.insertAdjacentHTML("beforeend", body(p, run));
      const pre = li.querySelector("pre code");
      li.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
        li.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        pre.textContent = b.dataset.v === "initial" ? p.code_initial : p.code;
      });
      li.querySelector(".copy").onclick = (e) => {
        const text = pre.textContent, btn = e.currentTarget;
        const done = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy code", 1200); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
        try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
      };
    }
    ol.appendChild(li);
  }
}

function select(i) {
  current = Math.max(0, Math.min(DATA.runs.length - 1, i));
  open = new Set();
  try { history.replaceState(null, "", "#" + DATA.runs[current].id); } catch (e) {}
  navs(); left(); filters(); props();
  $("props").scrollTop = 0;
}

$("q").addEventListener("input", props);
$("lightbox").addEventListener("click", () => { $("lightbox").hidden = true; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("lightbox").hidden = true;
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") select(current + 1);
  if (e.key === "ArrowLeft") select(current - 1);
});
const start = DATA.runs.findIndex((r) => "#" + r.id === location.hash);
select(start >= 0 ? start : 0);
</script>
</body>
