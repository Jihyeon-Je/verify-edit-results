<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Groups</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5b616e;
    --line: #e3e5ea;
    --tile: #f6f7f9;
    --good: #1a7f37;
    --miss: #b35900;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  [hidden] { display: none !important; }
  select, input { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); height: 100%; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 12px 20px 8px; }
  header h1 { margin: 0; font-size: 18px; }
  header .counts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  header .prompt { flex-basis: 100%; font-size: 12px; color: var(--muted); max-width: 120ch; }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 0 20px 12px; border-bottom: 1px solid var(--line); }
  .gen { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; }
  .gen img { width: 100%; height: 150px; object-fit: contain; display: block; background: #fff; }
  .gen .cap { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 4px 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
  .gen.hot { box-shadow: 0 0 0 3px var(--c); }
  .r { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: #fff; background: var(--c); border-radius: 4px; padding: 0 5px; white-space: nowrap; }

  .tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .tools input { width: 240px; }
  .groups { overflow: auto; min-height: 0; padding: 0 20px 80px; }
  table { border-collapse: collapse; width: 100%; min-width: 960px; table-layout: fixed; }
  col.name { width: 230px; } col.k { width: 52px; }
  th, td { border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; padding: 8px; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--bg); font-size: 12px; color: var(--muted); font-weight: 600; }
  td.namecell .name { font-weight: 600; }
  td.namecell .note { font-size: 12px; margin-top: 2px; }
  td.namecell .missing { font-size: 12px; margin-top: 4px; color: var(--miss); }
  td.k { font-variant-numeric: tabular-nums; font-weight: 600; }
  td.k.full { color: var(--good); }
  td.cell { font-size: 12.5px; }
  td.cell .m { padding: 2px 0; }
  td.cell.empty { text-align: center; color: var(--miss); }
  .nogroups { padding: 30px 8px; }

  .lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .7); display: grid; place-items: center; cursor: zoom-out; }
  .lightbox img { max-width: 90vw; max-height: 90vh; background: #fff; border-radius: 8px; }

  @media (max-width: 900px) { .app { height: auto; } }
</style>
</head>

// The object to show is in the address's #fragment, so a reload keeps it.
async function start() {
  const names = STATIC ? Object.keys(STATIC.assets) : await (await fetch("/api/assets")).json();
  const menu = $("#asset");
  menu.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join("");
  menu.hidden = names.length < 2;
  const wanted = decodeURIComponent(location.hash.slice(1));
  menu.value = names.includes(wanted) ? wanted : names[0];
  menu.addEventListener("change", () => { location.hash = menu.value; load(menu.value); });
  await load(menu.value);
}

async function load(asset) {
  if (STATIC) DATA = STATIC.assets[asset];
  else {
    const reply = await fetch(`/api/data?asset=${encodeURIComponent(asset)}`);
    DATA = await reply.json();
    if (!reply.ok) throw new Error(DATA.error || reply.status);
  }
  byKey = new Map();
  DATA.generations.forEach((g, gi) => g.properties.forEach(p => byKey.set(`${g.run}/${p.id}`, { run: g.run, gi, text: p.description || "" })));
  groups = (DATA.groups || []).map((g, i) => ({ ...g, order: i, members: (g.members || []).filter(k => byKey.has(k)) }));
  const grouped = new Set(groups.flatMap(g => g.members));
  document.title = `${DATA.request} · property groups`;
  $("#title").textContent = `${DATA.request}: properties across ${DATA.generations.length} generations`;
  $("#counts").textContent = `${byKey.size} properties · ${groups.length} groups` + (grouped.size < byKey.size ? ` · ${byKey.size - grouped.size} not in any group` : "");
  $("#prompt").textContent = DATA.image_prompt ? `Image prompt: ${DATA.image_prompt}` : "";
  $("#strip").innerHTML = DATA.generations.map((g, gi) => `
    <div class="gen" data-gen="${gi}" data-src="${esc(g.image)}" style="--c:${color(gi)}" title="Click to enlarge">
      ${g.image ? `<img src="${esc(g.image)}" alt="${esc(g.run)}">` : ""}
      <div class="cap"><span class="r" style="--c:${color(gi)}">${esc(g.run)}</span><span>${g.properties.length} properties</span></div>
    </div>`).join("");
  $("#cols").innerHTML = `<col class="name"><col class="k">` + DATA.generations.map(() => "<col>").join("");
  $("#ghead").innerHTML = `<th>Group</th><th title="Generations with at least one property in the group">In</th>`
    + DATA.generations.map((g, gi) => `<th><span class="r" style="--c:${color(gi)}">${esc(g.run)}</span></th>`).join("");
  render();
}

function render() {
  const gens = DATA.generations, q = state.q.trim().toLowerCase();
  let list = groups.filter(g => !q || g.name.toLowerCase().includes(q) || (g.note || "").toLowerCase().includes(q)
    || g.members.some(k => byKey.get(k).text.toLowerCase().includes(q)));
  if (state.sort === "count") list.sort((a, b) => runsOf(b).size - runsOf(a).size || a.order - b.order);
  else if (state.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
  else list.sort((a, b) => a.order - b.order);
  $("#shown").textContent = q ? `${list.length} of ${groups.length} groups` : "";
  if (!list.length) {
    $("#gbody").innerHTML = `<tr><td class="nogroups" colspan="${gens.length + 2}">${groups.length ? "No groups match." : "No groups yet."}</td></tr>`;
    return;
  }
  $("#gbody").innerHTML = list.map(g => {
    const present = runsOf(g);
    const missing = gens.filter(gen => !present.has(gen.run)).map(gen => gen.run);
    const cells = gens.map((gen, gi) => {
      const mine = g.members.filter(k => byKey.get(k).run === gen.run);
      if (!mine.length) return `<td class="cell empty">missing</td>`;
      return `<td class="cell">${mine.map(k => `<div class="m" data-gi="${gi}">${esc(byKey.get(k).text)}</div>`).join("")}</td>`;
    }).join("");
    return `<tr>
      <td class="namecell">
        <div class="name">${esc(g.name || "untitled")}</div>
        ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}
        ${missing.length ? `<div class="missing">Missing in ${missing.join(", ")}</div>` : ""}
      </td>
      <td class="k${present.size === gens.length ? " full" : ""}">${present.size}/${gens.length}</td>${cells}
    </tr>`;
  }).join("");
}

$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });

// Hovering a property outlines its generation's image; clicking an image enlarges it.
function hot(gi) { document.querySelectorAll(".gen").forEach(el => el.classList.toggle("hot", gi != null && el.dataset.gen === String(gi))); }
document.addEventListener("mouseover", e => { const el = e.target.closest(".m"); hot(el ? el.dataset.gi : null); });
$("#strip").addEventListener("click", e => {
  const card = e.target.closest(".gen");
  if (!card || !card.dataset.src) return;
  $("#lbimg").src = card.dataset.src;
  $("#lb").hidden = false;
});
$("#lb").addEventListener("click", () => { $("#lb").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lb").hidden = true; });

start().catch(err => { document.body.textContent = `Could not load the data: ${err.message}`; });
</script>
</body>
</html>
