<head>

<title>Counterexample Search</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5b616e;
    --line: #e3e5ea;
    --tile: #f6f7f9;
    --accent: #3451d1;
    --accent-soft: #eef2fc;
    --good: #1a7f37;
    --good-soft: #e3f4e8;
    --bad: #cf222e;
    --bad-soft: #fdf0f1;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  [hidden] { display: none !important; }
  select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  header { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); }
  .titlerow { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--fg); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; padding: 16px 20px 40px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }

  .timeline { display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
  .rail { display: flex; flex-direction: column; align-items: center; }
  .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--accent); flex: none; font-variant-numeric: tabular-nums; }
  .dot.start { background: var(--fg); }
  .dot.stop { background: var(--muted); }
  .dot.unresolved { background: var(--bad); }
  .bar { width: 2px; flex: 1; background: var(--line); margin: 4px 0; min-height: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 12px; margin-bottom: 14px; min-width: 0; }
  .card .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .card .kind { font-size: 19px; font-weight: 700; margin: 2px 0 6px; }
  .card .stated { font-size: 12.5px; color: var(--muted); font-style: italic; margin: 0 0 4px; }
  .card .fits { font-size: 12px; color: var(--muted); margin: 1px 0 4px; }
  .kinds { display: grid; gap: 0; }
  .ce + .ce { border-top: 1px dashed var(--line); padding-top: 6px; }
  .ce .kind { margin: 2px 0 2px; }
  .ce.withimg { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: start; padding-bottom: 6px; }
  .ce img, .thumbs img { width: 100%; max-width: 150px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
  .thumbs figure { margin: 0; width: 110px; }
  .thumbs img { max-width: 110px; }
  .thumbs figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card p { margin: 4px 0 8px; font-size: 13px; }
  .card .sub { font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 10px 0 3px; }
  ul.props { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  ul.props li { font-size: 13px; padding: 3px 8px; border-radius: 5px; background: var(--tile); display: flex; gap: 8px; }
  ul.props li .pid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); flex: none; padding-top: 1px; }
  ul.props.added li { background: var(--good-soft); }
  ul.props.added li .pid { color: var(--good); }
  ul.props.compact li { font-size: 12px; padding: 2px 8px; }
  .none { font-size: 13px; color: var(--bad); }
  details summary { cursor: pointer; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-top: 8px; }

  .pool { position: sticky; top: 12px; }
  .pool ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .pool li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px; font-size: 12.5px; padding: 3px 8px; border-radius: 5px; border-left: 3px solid transparent; }
  .pool li .pid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 1px; }
  .pool li .when { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .pool li.in { background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  .pool li.in .when { color: var(--accent); font-weight: 600; }
  .pool li .was { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .pool .count { font-size: 12.5px; color: var(--muted); margin: -4px 0 8px; font-variant-numeric: tabular-nums; }
  .err { color: var(--bad); padding: 20px; }

  .prompts { display: grid; gap: 4px; margin-top: 8px; }
  details.prompt { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  details.prompt summary { cursor: pointer; font-size: 11.5px; font-weight: 600; color: var(--accent); padding: 3px 8px; margin: 0; }
  details.prompt[open] summary { border-bottom: 1px solid var(--line); }
  details.prompt .plab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin: 8px 10px 3px; }
  details.prompt pre { margin: 0 10px 8px; padding: 8px 10px; background: var(--tile); border-radius: 5px; font-family: var(--mono); font-size: 11.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto; }
  details.prompt .thumbs { margin: 0 10px 10px; }

  .stages { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-left: auto; }
  .stages button { font: inherit; font-size: 12.5px; border: 0; background: var(--bg); color: var(--muted); padding: 4px 12px; cursor: pointer; }
  .stages button + button { border-left: 1px solid var(--line); }
  .stages button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

  .nlist { display: grid; gap: 10px; }
  .nitem { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; }
  .nitem.nec { border-left-color: var(--good); }
  .nitem.notnec { border-left-color: var(--bad); }
  .nhead { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .nhead .pid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .nprop { font-weight: 700; font-size: 14px; flex: 1; min-width: 0; }
  .verdict { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .nec .verdict { color: var(--good); background: var(--good-soft); }
  .notnec .verdict { color: var(--bad); background: var(--bad-soft); }
  .nrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 2px 0; }
  .nlab { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding-top: 2px; }
  .ngroup { border-left: 4px solid var(--line); padding: 4px 0 6px 10px; margin-bottom: 10px; border-radius: 2px; }
  .ngroup .ntitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .ngroup ul { margin: 0; padding-left: 0; list-style: none; font-size: 12.5px; line-height: 1.5; }
  .ngroup .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .ngroup.nec { border-left-color: var(--good); background: var(--good-soft); } .ngroup.nec .ntitle { color: var(--good); }
  .ngroup.notnec { border-left-color: var(--bad); background: var(--bad-soft); } .ngroup.notnec .ntitle { color: var(--bad); }
</style>
</head>

</header>

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function load(name) {
  if (STATIC) return STATIC.classes[name];
  const r = await fetch(`/api/data?class=${encodeURIComponent(name)}`);
  return r.json();
}

function propList(ids, byId, cls = "") {
  if (!ids.length) return "";
  return `<ul class="props ${cls}">${ids.map((i) => `<li><span class="pid">${esc(i)}</span><span>${esc(byId[i]?.description ?? "")}</span></li>`).join("")}</ul>`;
}

// The statement Opus gave, before it was split into the atomic properties listed under it (generated runs only).
const stated = (s) => (s ? `<div class="stated">Stated: “${esc(s)}”, split into:</div>` : "");

// The exact prompts of a step: one toggle per call, showing the system prompt (by name in systems), the user message,
// and any images sent with it. A render call has no system prompt: its text is what the image model was given.
const prompts = (d, calls, systems) => (calls && calls.length
  ? `<div class="prompts">${calls.map((c) => `<details class="prompt"><summary>Prompt · ${esc(c.step)}</summary>
      ${c.system ? `<div class="plab">System prompt</div><pre>${esc((systems || {})[c.system] || "(not saved)")}</pre>` : ""}
      <div class="plab">${c.system ? "User message" : "Prompt to the image model"}</div><pre>${esc(c.user)}</pre>
      ${c.images && c.images.length ? `<div class="plab">Images sent</div><div class="thumbs">${c.images.map((i) => `<img src="${imgSrc(d, i)}" alt="">`).join("")}</div>` : ""}
    </details>`).join("")}</div>`
  : "");

// Images of image-render runs: served from the run folder, or copied next to the static page.
const imgSrc = (d, rel) => (STATIC ? `${STATIC.images}/${d.class}/${rel}` : `/file/${d.class}/${rel}`);
const thumbs = (d, renders, title) => (renders.length
  ? `<div class="sub">${title}</div><div class="thumbs">${renders.map((x) => `<figure><img src="${imgSrc(d, x.image)}" alt=""><figcaption>${esc(x.kind)}</figcaption></figure>`).join("")}</div>`
  : "");

let stage = 1;
let shown = null;  // the run on the page, re-rendered when the stage changes

// Stage 2: for each property of the final set, its opposite, the question asked, and the answer.
function renderNecessary(d) {
  const t = d.trace;
  const n = d.necessity;
  document.getElementById("title").textContent = `Necessity check · ${t.class}`;
  if (!n) {
    document.getElementById("meta").innerHTML = `<span>Run: <b>${esc(d.class.split("/").slice(1).join("/"))}</b></span>`;
    document.getElementById("main").innerHTML = `<div class="err">Stage 2 has not been run on this run's final set yet.</div>`;
    return;
  }
  const yes = n.items.filter((i) => i.necessary);
  const no = n.items.filter((i) => !i.necessary);
  document.getElementById("meta").innerHTML = [
    `<span>Run: <b>${esc(d.class.includes("/") ? d.class.split("/").slice(1).join("/") : d.class)}</b></span>`,
    n.complete === false ? `<span><b>In progress:</b> ${n.items.length} of ${t.final_set.length} checked so far, refresh for more</span>`
                         : `<span>Checked: <b>${n.items.length}</b> properties, the stage 1 final set</span>`,
    `<span>Necessary: <b>${yes.length}</b></span>`,
    `<span>Not necessary: <b>${no.length}</b></span>`,
    n.prompts_rebuilt ? `<span>Prompts rebuilt from the saved answers</span>` : "",
    `<span>A property is necessary when the answer is no: an object with its opposite would not be a typical member.</span>`,
  ].join("");
  const card = (i) => `<div class="nitem ${i.necessary ? "nec" : "notnec"}">
      <div class="nhead"><span class="pid">${esc(i.id)}</span><span class="nprop">${esc(i.property)}</span><span class="verdict">${i.necessary ? "Necessary" : "Not necessary"}</span></div>
      <div class="nrow"><span class="nlab">Opposite</span><span>${esc(i.opposite)}</span></div>
      <div class="nrow"><span class="nlab">Question</span><span>${esc(i.question)}</span></div>
      <div class="nrow"><span class="nlab">Answer</span><span><b>${esc(i.answer.charAt(0).toUpperCase() + i.answer.slice(1))}.</b> ${esc(i.reason)}</span></div>
      ${prompts(d, i.calls, n.systems)}
    </div>`;
  const group = (items, cls, title) => `<div class="ngroup ${cls}"><div class="ntitle">${title} (${items.length})</div>
      <ul>${items.map((i) => `<li><span class="pid">${esc(i.id)}</span> ${esc(i.property)}</li>`).join("")}</ul></div>`;
  document.getElementById("main").innerHTML = `
    <section><h2>Each property</h2><div class="nlist">${n.items.map(card).join("")}</div></section>
    <section class="pool"><h2>Summary</h2>${group(yes, "nec", "Necessary")}${group(no, "notnec", "Not necessary")}</section>`;
}

function render(d) {
  shown = d;
  document.querySelectorAll(".stage").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.stage) === stage)));
  if (stage === 2) return renderNecessary(d);
  const t = d.trace;
  const byId = Object.fromEntries(d.pool.map((p) => [p.id, p]));
  document.getElementById("title").textContent = `Counterexample search · ${t.class}`;
  const added = t.rounds.reduce((n, r) => n + (r.added || []).length, 0);
  document.getElementById("meta").innerHTML = [
    `<span>Run: <b>${esc(d.class.includes("/") ? d.class.split("/").slice(1).join("/") : d.class)}</b></span>`,
    `<span>Pool: <b>${d.pool.length}</b> properties (${esc(t.source || t.pool)})</span>`,

    `<span>Start: <b>${t.start.set.length}</b></span>`,

    `<span>Final set: <b>${t.final_set.length}</b></span>`,
    `<span>Model: ${esc(t.model)}</span>`,
    t.prompts_rebuilt ? `<span>Prompts rebuilt from the trace (this run predates recording them)</span>` : "",
  ].join("");

  // When each property came in: "start" or the round number.
  const when = {};
  t.start.set.forEach((i) => (when[i] = "start"));
  t.rounds.forEach((r) => (r.added || []).forEach((i) => (when[i] = `round ${r.round}`)));

  const steps = [];
  steps.push(`<div class="step"><div class="rail"><div class="dot start">S</div><div class="bar"></div></div>
    <div class="card"><div class="label">Starting set</div>
      <p>${esc(t.start.reason)}</p>${stated(t.start.proposed)}${propList(t.start.set, byId)}
      ${(t.references || []).length ? thumbs(d, t.references.map((x, n) => ({ image: x, kind: `reference ${n + 1}` })), "Reference members, shown each round when stating the next property") : ""}
      ${prompts(d, t.start.calls, t.systems)}</div></div>`);
  for (const r of t.rounds) {
    const ok = (r.added || []).length > 0;
    // Earlier runs kept one counterexample per round ({counterexample, why}); later ones up to three ({counterexamples}).
    const kinds = r.counterexamples || [{ kind: r.counterexample, why: r.why }];
    const fits = r.set.length === 1 ? "the one property of the set" : `all ${r.set.length} properties of the set`;
    const rendered = t.counterexamples_from === "image renders";
    steps.push(`<div class="step"><div class="rail"><div class="dot ${ok ? "" : "unresolved"}">${r.round}</div><div class="bar"></div></div>
      <div class="card"><div class="label">Round ${r.round} · ${kinds.length === 1 ? "counterexample" : `${kinds.length} counterexamples`}</div>
        <div class="fits">${rendered ? `Rendered from ${fits}, and judged not ${esc(t.class)}.` : `${kinds.length === 1 ? "Has" : "Each has"} ${fits}.`}</div>
        <div class="kinds">${kinds.map((c) => `<div class="ce ${c.image ? "withimg" : ""}">${c.image ? `<img src="${imgSrc(d, c.image)}" alt="">` : ""}<div><div class="kind">${esc(c.kind)}</div><p>${esc(c.why)}</p></div></div>`).join("")}</div>
        ${thumbs(d, (r.renders || []).filter((x) => x.member), `Also rendered, judged ${esc(t.class)}`)}
        ${r.difference ? `<div class="sub">How ${kinds.length === 1 ? "it differs" : "they differ"} from the reference members</div><p>${esc(r.difference)}</p>` : ""}
        ${ok ? `<div class="sub">Added to tell ${kinds.length === 1 ? "it" : "them"} apart</div>${stated(r.proposed)}${propList(r.added, byId, "added")}<p>${esc(r.reason)}</p>`
             : `<div class="sub">Added</div><div class="none">${esc(r.outcome ? r.outcome.charAt(0).toUpperCase() + r.outcome.slice(1) : "Nothing")}.</div>`}
        <details><summary>Set at this round (${r.set.length})</summary>${propList(r.set, byId, "compact")}</details>
        ${prompts(d, r.calls, t.systems)}
      </div></div>`);
  }
  steps.push(`<div class="step"><div class="rail"><div class="dot stop">■</div></div>
    <div class="card"><div class="label">Stopped</div><p>${esc(t.stop.charAt(0).toUpperCase() + t.stop.slice(1))}.</p>
      ${thumbs(d, t.final_renders || [], "Last renders")}
      ${prompts(d, t.stop_calls, t.systems)}
      <div class="sub">Final set (${t.final_set.length})</div>${propList(t.final_set, byId)}</div></div>`);

  const pool = d.pool.map((p) => `<li class="${when[p.id] ? "in" : ""}"><span class="pid">${esc(p.id)}</span><span>${esc(p.description)}${p.original ? `<span class="was">was: ${esc(p.original)}</span>` : ""}</span><span class="when">${when[p.id] || ""}</span></li>`).join("");
  document.getElementById("main").innerHTML = `
    <section><h2>Trace</h2><div class="timeline">${steps.join("")}</div></section>
    <section class="pool"><h2>Property pool</h2><div class="count">${t.final_set.length} of ${d.pool.length} in the final set</div><ul>${pool}</ul></section>`;
}

(async () => {
  try {
    const names = STATIC ? Object.keys(STATIC.classes) : await (await fetch("/api/classes")).json();
    const sel = document.getElementById("cls");
    sel.innerHTML = names.map((n) => `<option value="${esc(n)}">${esc(n.split("/").join(" / "))}</option>`).join("");
    sel.hidden = names.length < 2;
    sel.onchange = async () => { history.replaceState(null, "", `#${sel.value}`); render(await load(sel.value)); };
    document.querySelectorAll(".stage").forEach((b) => (b.onclick = () => { stage = Number(b.dataset.stage); if (shown) render(shown); }));
    // A run can be opened directly as #<class>/<run>.
    const wanted = decodeURIComponent(location.hash.slice(1));
    if (names.includes(wanted)) sel.value = wanted;
    if (names.length) render(await load(sel.value));
    else document.getElementById("main").innerHTML = `<div class="err">No traces found.</div>`;
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="err">${esc(e)}</div>`;
  }
})();
</script>
</body>
</html>
