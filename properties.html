<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Review</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5b616e;
    --faint: #8b919c;
    --line: #e3e5ea;
    --tile: #f6f7f9;
    --sel: #eef2ff;
    --accent: #3451d1;
    --good: #1a7f37;
    --good-soft: #e3f4e8;
    --bad: #cf222e;
    --bad-soft: #fde8ea;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100%; }

  /* sidebar */
  aside { border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 14px 4px; }
  aside .root { font-family: var(--mono); font-size: 11px; color: var(--faint); padding: 0 14px 10px; overflow-wrap: anywhere; }
  aside input { margin: 0 12px 10px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .runs { overflow-y: auto; overflow-x: hidden; padding-bottom: 12px; min-width: 0; }
  .run-item { display: grid; gap: 3px; padding: 7px 14px; cursor: pointer; border-left: 3px solid transparent; min-width: 0; }
  .run-item:hover { background: var(--tile); }
  .run-item.active { background: var(--sel); border-left-color: var(--accent); }
  .run-item .t { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
  .run-item .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .run-item .rid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; flex: none; }
  .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--line); }
  .bar .g { background: var(--good); } .bar .b { background: var(--bad); }
  aside .foot { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--muted); }
  aside .foot code { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  aside .foot button { font: inherit; font-size: 12px; margin-top: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }

  /* main: a header, then the image and text on the left and the properties on the right, each scrolling on its own */
  main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; }
  .head-area { display: grid; gap: 8px; padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
  .panes { display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.1fr); min-height: 0; }
  .left { overflow: auto; padding: 16px 20px 40px; border-right: 1px solid var(--line); display: grid; gap: 16px; align-content: start; }
  .right { overflow: auto; padding: 0 20px 80px; min-width: 0; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
  .head h2 { margin: 0; font-size: 20px; }
  .head .rid { font-family: var(--mono); color: var(--muted); }
  .head .counts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .head .counts b.g { color: var(--good); } .head .counts b.b { color: var(--bad); }
  .head .saved { margin-left: auto; font-size: 12px; color: var(--faint); }
  .head .saved.err { color: var(--bad); }
  .siblings { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--sel); }

  .ref img { width: 100%; max-height: 52vh; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: var(--tile); display: block; }
  .ref .none { aspect-ratio: 1; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px; color: var(--faint); }
  .desc .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-bottom: 6px; }
  .desc .text { font-size: 16px; line-height: 1.65; max-width: 72ch; }
  .desc .noprompt { color: var(--faint); }

  .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
  .filters .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-right: 4px; }
  .filters .keys { flex-basis: 100%; font-size: 12px; color: var(--faint); }
  .filters kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

  .props { display: grid; gap: 0; }
  .prop { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line); scroll-margin: 90px; }
  .prop.sel { background: var(--sel); }
  .flagbox { display: flex; gap: 6px; align-items: flex-start; }
  .flag { width: 40px; height: 30px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); }
  .flag.good:hover { border-color: var(--good); color: var(--good); }
  .flag.bad:hover { border-color: var(--bad); color: var(--bad); }
  .flag.good.on { background: var(--good); border-color: var(--good); color: #fff; }
  .flag.bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .body { display: grid; gap: 4px; min-width: 0; }
  .line1 { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
  .pid { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .cat { font-size: 11.5px; color: var(--muted); background: var(--tile); border-radius: 4px; padding: 0 6px; }
  .cat.none { color: var(--bad); background: var(--bad-soft); }
  .olabel { font-size: 12px; color: var(--muted); }
  .src { font-size: 11px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--fg); }
  .src.implicit { border-style: dashed; color: var(--muted); border-color: var(--faint); }
  .ptext { font-size: 15px; }
  .constraint { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .from { font-size: 12.5px; color: var(--muted); }
  .from i { color: var(--faint); font-style: normal; }
  .note { display: flex; gap: 6px; align-items: center; }
  .note input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .note input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .empty { color: var(--faint); padding: 24px 0; }

  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 40vh; }
    main { overflow: visible; }
    .panes { grid-template-columns: 1fr; }
    .left, .right { overflow: visible; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Property review</h1>
    <div class="root" id="root"></div>
    <input type="search" id="q" placeholder="Filter runs" aria-label="Filter runs">
    <div class="runs" id="runs"></div>
    <div class="foot" id="foot">Flags save as you click, to <code id="flagsFile"></code></div>
  </aside>
  <main id="main">
    <div class="head-area">
      <div class="head">
        <h2 id="title"></h2><span class="rid" id="rid"></span>
        <span class="counts" id="counts"></span>
        <span class="saved" id="saved"></span>
      </div>
      <div class="siblings" id="siblings"></div>
    </div>
    <div class="panes">
      <section class="left" id="leftPane" aria-label="Reference and description">
        <div class="ref" id="ref"></div>
        <div class="desc">

          <div class="text" id="text"></div>

      </section>
      <section class="right" id="rightPane" aria-label="Properties">

        </div>
        <div class="props" id="props"></div>
      </section>
    </div>
  </main>
</div>

 on each side."}, {"id": "prop_i21", "description": "The panels are recessed.", "category": "Shape and geometry", "source": "implicit", "constraint": null, "from_statement": "The upper tier of the pedestal has three recessed vertical rectangular panels on each side."}, {"id": "prop_i22", "description": "The panels are vertical.", "category": "Pose and orientation", "source": "implicit", "constraint": null, "from_statement": "The upper tier of the pedestal has three recessed vertical rectangular panels on each side."}, {"id": "prop_i23", "description": "The panels are rectangular.", "category": "Shape and geometry", "source": "implicit", "constraint": null, "from_statement": "The upper tier of the pedestal has three recessed vertical rectangular panels on each side."}, {"id": "prop_i24", "description": "The lowest tier of the pedestal has one doorway shape on each side.", "category": "Count", "source": "implicit", "constraint": null, "from_statement": "The lowest tier of the pedestal has a small recessed doorway shape in the center of each side."}, {"id": "prop_i25", "description": "Each doorway shape is small.", "category": "Measurement", "source": "implicit", "constraint": null, "from_statement": "The lowest tier of the pedestal has a small recessed doorway shape in the center of each side."}, {"id": "prop_i26", "description": "Each doorway shape is recessed.", "category": "Shape and geometry", "source": "implicit", "constraint": null, "from_statement": "The lowest tier of the pedestal has a small recessed doorway shape in the center of each side."}, {"id": "prop_i27", "description": "Each doorway shape is in the center of its side.", "category": "Spatial relations", "source": "implicit", "constraint": null, "from_statement": "The lowest tier of the pedestal has a small recessed doorway shape in the center of each side."}], "flags": {}}]};
const STORE = "property-review-flags";
let DATA = null, current = null, selected = null, filter = "all";
const FILTERS = [["all", "All"], ["explicit", "Explicit"], ["implicit", "Implicit"], ["outside", "No category"], ["unflagged", "Unflagged"], ["good", "Good"], ["bad", "Bad"]];

function storedFlags() {
  try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; }
}

function load() {
  const source = STATIC ? Promise.resolve(STATIC) : fetch("/api/data").then(r => r.json());
  return source.then(d => {
    DATA = d;
    if (STATIC) {
      const saved = storedFlags();
      DATA.runs.forEach(r => { r.flags = { ...r.flags, ...(saved[r.key] || {}) }; });
      $("foot").innerHTML = `Flags save in this browser. <button type="button" id="download">Download flags</button>`;
      $("download").onclick = downloadFlags;
    }
    $("root").textContent = d.root;
    if (!STATIC) $("flagsFile").textContent = d.flags_file;
    const wanted = decodeURIComponent(location.hash.slice(1));
    const first = DATA.runs.find(r => r.key === wanted) || DATA.runs[0];
    sidebar(); if (first) open(first.key);
  });
}

function stats(run) {
  const n = run.properties.length;
  let g = 0, b = 0;
  for (const p of run.properties) { const f = (run.flags[p.id] || {}).flag; if (f === "good") g++; else if (f === "bad") b++; }
  return { n, g, b, left: n - g - b };
}

function sidebar() {
  const q = $("q").value.trim().toLowerCase();
  const box = $("runs"); box.innerHTML = "";
  for (const run of DATA.runs) {
    if (q && !(run.short_prompt + " " + run.key).toLowerCase().includes(q)) continue;
    const s = stats(run);
    const el = document.createElement("div");
    el.className = "run-item" + (current && current.key === run.key ? " active" : "");
    el.innerHTML = `<div class="t"><span class="name"></span><span class="rid"></span></div><div class="bar"><span class="g"></span><span class="b"></span></div>`;
    el.querySelector(".name").textContent = run.short_prompt || run.asset;
    el.querySelector(".rid").textContent = `${run.run} · ${s.g + s.b}/${s.n}`;
    el.querySelector(".g").style.width = (100 * s.g / Math.max(s.n, 1)) + "%";
    el.querySelector(".b").style.width = (100 * s.b / Math.max(s.n, 1)) + "%";
    el.onclick = () => open(run.key);
    box.appendChild(el);
  }
}

function open(key) {
  current = DATA.runs.find(r => r.key === key);
  selected = null;
  history.replaceState(null, "", "#" + encodeURIComponent(key));
  $("title").textContent = current.short_prompt || current.asset;
  $("rid").textContent = current.run;
  const ref = $("ref"); ref.innerHTML = "";
  if (current.reference) { const img = document.createElement("img"); img.src = current.reference; img.alt = "reference image"; ref.appendChild(img); }
  else ref.innerHTML = `<div class="none">no reference image</div>`;
  const sib = $("siblings"); sib.innerHTML = "";
  const others = DATA.runs.filter(r => r.asset === current.asset);
  if (others.length > 1) others.forEach(r => {
    const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = r.run;
    b.setAttribute("aria-pressed", String(r.key === current.key)); b.onclick = () => open(r.key); sib.appendChild(b);
  });
  filters(); renderText(); renderProps(); counts(); sidebar();
  $("leftPane").scrollTop = 0; $("rightPane").scrollTop = 0;
}

function counts() {
  const s = stats(current);
  const ex = current.properties.filter(p => p.source === "explicit").length;
  $("counts").innerHTML = `${s.n} properties (${ex} explicit, ${s.n - ex} implicit) · <b class="g">${s.g} good</b> · <b class="b">${s.b} bad</b> · ${s.left} unflagged`;
}

function filters() {
  const box = $("filters");
  box.querySelectorAll(".chip").forEach(c => c.remove());
  const keys = box.querySelector(".keys");
  for (const [k, label] of FILTERS) {
    const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(filter === k));
    b.onclick = () => { filter = k; filters(); renderProps(); };
    box.insertBefore(b, keys);
  }
}

function visible() {
  return current.properties.filter(p => {
    const f = (current.flags[p.id] || {}).flag;
    if (filter === "explicit") return p.source === "explicit";
    if (filter === "implicit") return p.source !== "explicit";
    if (filter === "outside") return p.category === "None";
    if (filter === "unflagged") return !f;
    if (filter === "good" || filter === "bad") return f === filter;
    return true;
  });
}

function renderText() {
  const box = $("text");
  box.textContent = current.prompt || "";
  if (!current.prompt) box.innerHTML = `<span class="noprompt">No text description in this run.</span>`;
}

function constraintText(c) {
  if (!c || typeof c !== "object") return "";
  const parts = [c.kind || ""];
  if (c.target != null) parts.push(`target ${typeof c.target === "object" ? JSON.stringify(c.target) : c.target}`);
  if (c.tolerance != null) parts.push(`± ${c.tolerance}`);
  if (c.unit) parts.push(c.unit);
  return parts.filter(Boolean).join(" · ");
}

function renderProps() {
  const box = $("props"); box.innerHTML = "";
  const list = visible();
  if (!list.length) { box.innerHTML = `<div class="empty">No properties match this filter.</div>`; return; }
  for (const p of list) {
    const f = current.flags[p.id] || {};
    const row = document.createElement("div");
    row.className = "prop"; row.id = "p-" + p.id; row.dataset.id = p.id;
    row.innerHTML = `
      <div class="flagbox"><button type="button" class="flag good" title="good (g)">Good</button><button type="button" class="flag bad" title="bad (b)">Bad</button></div>
      <div class="body">
        <div class="line1"><span class="pid"></span><span class="cat"></span><span class="src"></span><span class="olabel"></span></div>
        <div class="ptext"></div>
        <div class="constraint"></div>
        <div class="from"><i>split from:</i> <span></span></div>
        <div class="note"><input type="text" placeholder="note (optional, saves when you leave the box)"></div>
      </div>`;
    row.querySelector(".pid").textContent = p.id;
    row.querySelector(".cat").textContent = p.category || ""; row.querySelector(".cat").hidden = !p.category;
    row.querySelector(".cat").classList.toggle("none", p.category === "None");
    row.querySelector(".olabel").textContent = p.open_label ? "free label: " + p.open_label : ""; row.querySelector(".olabel").hidden = !p.open_label;
    const src = row.querySelector(".src"); src.textContent = p.source || ""; src.classList.add(p.source === "explicit" ? "explicit" : "implicit");
    row.querySelector(".ptext").textContent = p.description || "";
    row.querySelector(".from span").textContent = p.from_statement || ""; row.querySelector(".from").hidden = !p.from_statement;
    const ct = constraintText(p.constraint); row.querySelector(".constraint").textContent = ct; row.querySelector(".constraint").hidden = !ct;
    const good = row.querySelector(".flag.good"), bad = row.querySelector(".flag.bad");
    good.classList.toggle("on", f.flag === "good"); bad.classList.toggle("on", f.flag === "bad");
    bad.onclick = e => { e.stopPropagation(); setFlag(p.id, (current.flags[p.id] || {}).flag === "bad" ? "" : "bad"); };
    good.onclick = e => { e.stopPropagation(); setFlag(p.id, (current.flags[p.id] || {}).flag === "good" ? "" : "good"); };
    const note = row.querySelector(".note input"); note.value = f.note || "";
    note.onclick = e => e.stopPropagation();
    note.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter" || e.key === "Escape") note.blur(); };
    note.onchange = () => setNote(p.id, note.value);
    row.onclick = () => select(p.id, false);
    box.appendChild(row);
  }
  paint();
}

function paint() {
  document.querySelectorAll(".prop").forEach(row => row.classList.toggle("sel", row.dataset.id === selected));
}

function select(id, scroll) {
  selected = id; paint();
  const row = $("p-" + id);
  if (row && scroll) row.scrollIntoView({ block: "center", behavior: "smooth" });
}

function allFlags() {
  const out = {};
  DATA.runs.forEach(r => { if (Object.keys(r.flags).length) out[r.key] = r.flags; });
  return out;
}

function downloadFlags() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(allFlags(), null, 1)], { type: "application/json" }));
  a.download = "property_flags.json";
  a.click();
}

function post(id, body) {
  if (STATIC) {
    const entry = { ...(current.flags[id] || {}) };
    if ("flag" in body) { if (body.flag) entry.flag = body.flag; else delete entry.flag; }
    if ("note" in body) { if (String(body.note || "").trim()) entry.note = String(body.note).trim(); else delete entry.note; }
    delete entry.time;
    if (Object.keys(entry).length) current.flags[id] = { ...entry, time: new Date().toISOString() }; else delete current.flags[id];
    try { localStorage.setItem(STORE, JSON.stringify(allFlags())); $("saved").textContent = "saved in this browser"; }
    catch (e) { $("saved").textContent = "not saved: this browser blocks storage"; $("saved").classList.add("err"); }
    return Promise.resolve();
  }
  $("saved").textContent = "saving…"; $("saved").classList.remove("err");
  return fetch("/api/flag", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: current.key, id, ...body }) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(res => {
      if (Object.keys(res.entry || {}).length) current.flags[id] = res.entry; else delete current.flags[id];
      $("saved").textContent = "saved " + new Date().toLocaleTimeString();
    })
    .catch(() => { $("saved").textContent = "not saved: is the server running?"; $("saved").classList.add("err"); });
}

function setFlag(id, flag) {
  const entry = { ...(current.flags[id] || {}) };
  if (flag) entry.flag = flag; else delete entry.flag;
  current.flags[id] = entry;
  selected = id;
  post(id, { flag }).then(() => { renderProps(); counts(); sidebar(); select(id, false); });
}

function setNote(id, note) { post(id, { note }).then(() => { counts(); }); }

function move(step) {
  const ids = visible().map(p => p.id);
  if (!ids.length) return;
  const at = ids.indexOf(selected);
  const next = at < 0 ? (step > 0 ? 0 : ids.length - 1) : Math.min(ids.length - 1, Math.max(0, at + step));
  select(ids[next], true);
}

function stepRun(step) {
  const keys = DATA.runs.map(r => r.key);
  const at = keys.indexOf(current.key);
  const next = keys[Math.min(keys.length - 1, Math.max(0, at + step))];
  if (next && next !== current.key) open(next);
}

document.addEventListener("keydown", e => {
  if (!current || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "g" && selected) setFlag(selected, (current.flags[selected] || {}).flag === "good" ? "" : "good");
  else if (e.key === "b" && selected) setFlag(selected, (current.flags[selected] || {}).flag === "bad" ? "" : "bad");
  else if (e.key === "u" && selected) setFlag(selected, "");
  else if (e.key === "n" && selected) { e.preventDefault(); const i = document.querySelector(`#p-${selected} .note input`); if (i) i.focus(); }
  else if (e.key === "]") stepRun(1);
  else if (e.key === "[") stepRun(-1);
});
$("q").addEventListener("input", sidebar);
load();
</script>
